<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tâches">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mon Tableau de Bord</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #0f0f14;
  --bg2: #17171f;
  --bg3: #1f1f2a;
  --bg4: #26263a;
  --accent: #4f8ef7;
  --accent2: #7b5cf5;
  --success: #3ecf8e;
  --warn: #f5a623;
  --danger: #f75f5f;
  --text: #f0f0f5;
  --text2: #9090a8;
  --text3: #55556a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --r: 16px;
  --r2: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px}

#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* Header */
.header{padding:calc(var(--safe-top) + 16px) 20px 0;background:var(--bg);flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.header-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-date{font-size:12px;color:var(--text2);margin-top:3px;font-weight:300}
.clock-badge{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}

/* Progress ring summary */
.ring-row{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:15px;font-weight:700;font-family:'Syne',sans-serif;color:var(--text)}
.ring-label{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.mini-stats{display:flex;flex:1;gap:8px}
.mini-stat{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:10px 8px;text-align:center}
.mini-stat-num{font-size:20px;font-weight:700;font-family:'Syne',sans-serif}
.mini-stat-lbl{font-size:10px;color:var(--text2);margin-top:1px;line-height:1.2}
.c-blue{color:var(--accent)}
.c-red{color:var(--danger)}
.c-green{color:var(--success)}
.c-warn{color:var(--warn)}

/* Tabs */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg);margin-bottom:1px}
.tab{flex:1;font-size:13px;padding:10px 4px;text-align:center;color:var(--text2);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:.2px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Scroll */
.scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.scroll::-webkit-scrollbar{width:0}
.view{display:none;flex-direction:column;flex:1;overflow:hidden}
.view.active{display:flex}

/* Section label */
.sec-lbl{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;padding:0 2px}

/* Task card */
.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;transition:.15s;position:relative;overflow:hidden;cursor:default;animation:slideIn .25s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.tcard.urgent::before{background:var(--danger)}
.tcard.normal::before{background:var(--accent)}
.tcard.low::before{background:var(--success)}
.tcard.done-card{opacity:.5}
.tcard.overdue{border-color:rgba(247,95,95,.25);background:rgba(247,95,95,.04)}
.tcard-row{display:flex;align-items:center;gap:10px}
.cb{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative}
.cb.checked{background:var(--success);border-color:var(--success)}
.cb.checked::after{content:'';position:absolute;width:6px;height:10px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translate(0,-1px)}
.tcard-title{flex:1;font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.tcard-title.done-txt{text-decoration:line-through;color:var(--text3)}
.pri-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;flex-shrink:0}
.pri-urgent{background:rgba(247,95,95,.15);color:var(--danger)}
.pri-normal{background:rgba(79,142,247,.15);color:var(--accent)}
.pri-low{background:rgba(62,207,142,.15);color:var(--success)}
.pri-done{background:rgba(144,144,168,.1);color:var(--text3)}
.del-btn{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;flex-shrink:0;transition:.2s}
.del-btn:active{color:var(--danger)}
.tcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text2)}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dl-txt{margin-left:auto;font-weight:500}
.pbar{height:3px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .4s}

/* FAB */
.fab{position:sticky;bottom:0;margin:0;padding:14px 20px;padding-bottom:calc(14px + var(--safe-bot));background:linear-gradient(to top,var(--bg) 60%,transparent);flex-shrink:0}
.fab-btn{width:100%;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:500;font-family:'Syne',sans-serif;cursor:pointer;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;box-shadow:0 4px 24px rgba(79,142,247,.3)}
.fab-btn:active{transform:scale(.97);opacity:.9}
.fab-plus{font-size:20px;font-weight:300}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:24px 24px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
.modal::-webkit-scrollbar{width:0}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--bg4);border-radius:4px;margin:0 auto 18px}
.modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:18px}
.fgroup{margin-bottom:14px}
.flabel{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.finput{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r2);font-size:14px;background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:.2s;-webkit-appearance:none}
.finput:focus{border-color:var(--accent)}
.frow{display:flex;gap:10px}
.frow .fgroup{flex:1}
.pri-select{display:flex;gap:6px}
.pri-opt{flex:1;padding:10px 6px;text-align:center;border:1px solid var(--border2);border-radius:var(--r2);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:.2s;background:var(--bg3)}
.pri-opt.sel-urgent{border-color:var(--danger);color:var(--danger);background:rgba(247,95,95,.1)}
.pri-opt.sel-normal{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1)}
.pri-opt.sel-low{border-color:var(--success);color:var(--success);background:rgba(62,207,142,.1)}
.btn-row{display:flex;gap:10px;margin-top:18px;padding-bottom:calc(var(--safe-bot) + 4px)}
.btn-cancel{flex:1;padding:13px;border:1px solid var(--border2);background:transparent;border-radius:var(--r2);font-size:14px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-save{flex:2;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--r2);font-size:14px;font-weight:500;cursor:pointer;font-family:'Syne',sans-serif}

/* Stats view */
.stats-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.stats-scroll::-webkit-scrollbar{width:0}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.scard-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:12px;font-weight:500}
.activity-item{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-time{color:var(--text3);white-space:nowrap;font-size:12px}

/* Timeline */
.tl-item{display:flex;gap:12px;position:relative}
.tl-left{display:flex;flex-direction:column;align-items:center;width:16px;flex-shrink:0}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;border:2px solid var(--bg2)}
.tl-line{width:1px;background:var(--border2);flex:1;min-height:20px;margin:4px 0}
.tl-body{padding-bottom:18px;flex:1}
.tl-date{font-size:11px;color:var(--text3);font-weight:500}
.tl-task{font-size:14px;font-weight:500;color:var(--text);margin-top:2px}
.tl-meta{font-size:12px;color:var(--text2);margin-top:3px;display:flex;gap:8px;align-items:center}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:14px;line-height:1.6}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}

/* Toast */
.toast{position:fixed;top:calc(var(--safe-top) + 12px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:10px 18px;font-size:13px;color:var(--text);z-index:300;transition:.3s cubic-bezier(.4,0,.2,1);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">Tableau de bord</div>
        <div class="header-date" id="hdate"></div>
      </div>
      <div class="clock-badge" id="clock"></div>
    </div>
    <div class="ring-row">
      <div class="ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,.06)" stroke-width="7" fill="none"/>
          <circle cx="32" cy="32" r="26" id="ring-circle" stroke="url(#rg)" stroke-width="7" fill="none"
            stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" style="transition:.6s"/>
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f8ef7"/><stop offset="100%" stop-color="#7b5cf5"/>
          </linearGradient></defs>
        </svg>
        <div class="ring-center"><span class="ring-pct" id="ring-pct">0%</span><span class="ring-label">fait</span></div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-stat-num c-blue" id="ms-todo">0</div><div class="mini-stat-lbl">À faire</div></div>
        <div class="mini-stat"><div class="mini-stat-num c-red" id="ms-late">0</div><div class="mini-stat-lbl">En retard</div></div>
        <div class="mini-stat"><div class="mini-stat-num c-green" id="ms-done">0</div><div class="mini-stat-lbl">Terminées</div></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tasks',this)">Tâches</button>
      <button class="tab" onclick="switchTab('stats',this)">Synthèse</button>
      <button class="tab" onclick="switchTab('timeline',this)">Calendrier</button>
    </div>
  </div>

  <!-- TASKS VIEW -->
  <div class="view active" id="view-tasks">
    <div class="scroll" id="tasks-scroll"></div>
    <div class="fab">
      <button class="fab-btn" onclick="openModal()"><span class="fab-plus">+</span> Ajouter une tâche</button>
    </div>
  </div>

  <!-- STATS VIEW -->
  <div class="view" id="view-stats">
    <div class="stats-scroll">
      <div class="scard">
        <div class="scard-title">Par priorité</div>
        <div id="by-pri"></div>
      </div>
      <div class="scard">
        <div class="scard-title">Par catégorie</div>
        <div id="by-cat"></div>
      </div>
      <div class="scard">
        <div class="scard-title">Activité récente</div>
        <div id="activity"></div>
      </div>
    </div>
  </div>

  <!-- TIMELINE VIEW -->
  <div class="view" id="view-timeline">
    <div class="scroll" id="tl-scroll"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nouvelle tâche</div>
    <div class="fgroup">
      <label class="flabel">Titre</label>
      <input class="finput" id="f-title" placeholder="Décrivez votre tâche..." autocomplete="off">
    </div>
    <div class="frow">
      <div class="fgroup">
        <label class="flabel">Date limite</label>
        <input class="finput" id="f-date" type="date">
      </div>
      <div class="fgroup">
        <label class="flabel">Catégorie</label>
        <input class="finput" id="f-cat" placeholder="Travail..." autocomplete="off">
      </div>
    </div>
    <div class="fgroup">
      <label class="flabel">Priorité</label>
      <div class="pri-select">
        <div class="pri-opt" data-p="urgent" onclick="setPri(this)">Urgent</div>
        <div class="pri-opt sel-normal" data-p="normal" onclick="setPri(this)">Normal</div>
        <div class="pri-opt" data-p="low" onclick="setPri(this)">Faible</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="addTask()">Ajouter la tâche</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS=['#4f8ef7','#3ecf8e','#f5a623','#f75f5f','#7b5cf5','#e879f9','#22d3ee','#f97316'];
let selPri='normal';
let tasks=[], activity=[], nextId=1;

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

function load(){
  tasks=ls('tb_tasks',[]);
  activity=ls('tb_activity',[]);
  nextId=ls('tb_nid',1);
  if(!tasks.length) seed();
}

function seed(){
  const t=today();
  const tom=addDays(t,1);
  const yes=addDays(t,-1);
  tasks=[
    {id:nextId++,title:'Préparer la présentation client',date:t,priority:'urgent',cat:'Travail',done:false,created:t},
    {id:nextId++,title:'Réunion équipe marketing',date:tom,priority:'normal',cat:'Travail',done:false,created:t},
    {id:nextId++,title:'Payer les factures',date:yes,priority:'urgent',cat:'Personnel',done:false,created:addDays(t,-3)},
    {id:nextId++,title:'Rapport mensuel RH',date:addDays(t,2),priority:'normal',cat:'RH',done:false,created:t},
    {id:nextId++,title:'Formation en ligne Python',date:addDays(t,4),priority:'low',cat:'Formation',done:true,created:addDays(t,-2)},
    {id:nextId++,title:'Appel fournisseur',date:t,priority:'normal',cat:'Travail',done:false,created:t},
  ];
  save();
}

function save(){ss('tb_tasks',tasks);ss('tb_activity',activity);ss('tb_nid',nextId)}

function today(){return new Date().toISOString().split('T')[0]}
function addDays(d,n){const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0]}

function daysLeft(d){return Math.ceil((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}

function dlInfo(d){
  const dl=daysLeft(d);
  if(dl<0)return{txt:`Retard ${Math.abs(dl)}j`,color:'var(--danger)'};
  if(dl===0)return{txt:"Aujourd'hui",color:'var(--warn)'};
  if(dl===1)return{txt:'Demain',color:'var(--warn)'};
  return{txt:`J+${dl}`,color:'var(--text2)'};
}

function catColor(c){let h=0;for(let ch of(c||''))h=(h*31+ch.charCodeAt(0))%CATS.length;return CATS[h]}

function progPct(t){
  const s=new Date((t.created||t.date)+'T12:00:00');
  const e=new Date(t.date+'T12:00:00');
  const n=new Date();
  const tot=Math.max(1,e-s);
  return Math.min(100,Math.max(0,Math.round(((n-s)/tot)*100)));
}

function fmtDate(d){
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function renderAll(){updateHeader();renderTasks();renderStats();renderTimeline()}

function updateHeader(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('hdate').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const total=tasks.length;
  const done=tasks.filter(t=>t.done).length;
  const todo=tasks.filter(t=>!t.done&&t.date>=today()).length;
  const late=tasks.filter(t=>!t.done&&t.date<today()).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('ring-pct').textContent=pct+'%';
  document.getElementById('ring-circle').style.strokeDashoffset=163.4*(1-pct/100);
  document.getElementById('ms-todo').textContent=todo;
  document.getElementById('ms-late').textContent=late;
  document.getElementById('ms-done').textContent=done;
}

function renderTasks(){
  const t0=today();
  const late=tasks.filter(t=>!t.done&&t.date<t0).sort((a,b)=>PORD[a.priority]-PORD[b.priority]);
  const todayT=tasks.filter(t=>!t.done&&t.date===t0).sort((a,b)=>PORD[a.priority]-PORD[b.priority]);
  const upcoming=tasks.filter(t=>!t.done&&t.date>t0).sort((a,b)=>a.date.localeCompare(b.date)||PORD[a.priority]-PORD[b.priority]);
  const done=tasks.filter(t=>t.done);
  const sc=document.getElementById('tasks-scroll');
  sc.innerHTML='';
  if(!tasks.length){sc.innerHTML='<div class="empty"><div class="empty-icon">✓</div>Aucune tâche.<br>Ajoutez-en une pour commencer !</div>';return}
  if(late.length){sc.appendChild(label('En retard'));late.forEach(t=>sc.appendChild(card(t,true)))}
  if(todayT.length){sc.appendChild(label("Aujourd'hui"));todayT.forEach(t=>sc.appendChild(card(t,false)))}
  if(upcoming.length){sc.appendChild(label('À venir'));upcoming.forEach(t=>sc.appendChild(card(t,false)))}
  if(done.length){sc.appendChild(label('Terminées'));done.forEach(t=>sc.appendChild(card(t,false)))}
}

const PORD={urgent:0,normal:1,low:2};
const PLBL={urgent:'Urgent',normal:'Normal',low:'Faible'};

function label(txt){
  const d=document.createElement('div');
  d.className='sec-lbl';d.textContent=txt;return d;
}

function card(t,overdue){
  const d=document.createElement('div');
  d.className=`tcard ${t.priority}${t.done?' done-card':''}${overdue?' overdue':''}`;
  const dl=dlInfo(t.date);
  const pct=progPct(t);
  const barColor=overdue?'var(--danger)':t.priority==='urgent'?'var(--danger)':'var(--accent)';
  d.innerHTML=`
    <div class="tcard-row">
      <button class="cb${t.done?' checked':''}" onclick="toggle(${t.id})" aria-label="Marquer terminée"></button>
      <span class="tcard-title${t.done?' done-txt':''}">${esc(t.title)}</span>
      <span class="pri-badge ${t.done?'pri-done':'pri-'+t.priority}">${t.done?'Fait':PLBL[t.priority]}</span>
      <button class="del-btn" onclick="del(${t.id})" aria-label="Supprimer">×</button>
    </div>
    <div class="tcard-meta">
      <span class="cat-dot" style="background:${catColor(t.cat||'')}"></span>
      <span>${esc(t.cat||'Général')}</span>
      <span style="font-size:11px;color:var(--text3)">${fmtDate(t.date)}</span>
      <span class="dl-txt" style="color:${dl.color}">${dl.txt}</span>
    </div>
    ${!t.done?`<div class="pbar"><div class="pbar-fill" style="background:${barColor};width:${pct}%"></div></div>`:''}
  `;
  return d;
}

function renderStats(){
  const total=tasks.length||1;
  const counts={urgent:0,normal:0,low:0};
  const catMap={};
  tasks.forEach(t=>{
    counts[t.priority]=(counts[t.priority]||0)+1;
    const c=t.cat||'Général';
    catMap[c]=(catMap[c]||0)+1;
  });
  const bp=document.getElementById('by-pri');
  bp.innerHTML=['urgent','normal','low'].map(p=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:13px;width:52px;color:var(--text2)">${PLBL[p]}</span>
      <div style="flex:1;background:var(--bg4);border-radius:4px;height:6px;overflow:hidden">
        <div style="height:100%;border-radius:4px;background:${p==='urgent'?'var(--danger)':p==='normal'?'var(--accent)':'var(--success)'};width:${Math.round(counts[p]/total*100)}%;transition:.4s"></div>
      </div>
      <span style="font-size:13px;font-weight:500;color:var(--text);width:20px;text-align:right">${counts[p]}</span>
    </div>
  `).join('');
  const bc=document.getElementById('by-cat');
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  bc.innerHTML=cats.map(([c,n])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span class="cat-dot" style="background:${catColor(c)}"></span>
      <span style="font-size:13px;flex:1;color:var(--text2)">${esc(c)}</span>
      <div style="width:80px;background:var(--bg4);border-radius:4px;height:6px;overflow:hidden">
        <div style="height:100%;border-radius:4px;background:${catColor(c)};width:${Math.round(n/(tasks.length||1)*100)}%;transition:.4s"></div>
      </div>
      <span style="font-size:13px;font-weight:500;color:var(--text);width:20px;text-align:right">${n}</span>
    </div>
  `).join('');
  const al=document.getElementById('activity');
  if(!activity.length){al.innerHTML='<div style="color:var(--text3);font-size:13px;padding:4px 0">Aucune activité récente.</div>';return}
  al.innerHTML=activity.slice(0,8).map(a=>`
    <div class="activity-item"><span>${esc(a.txt)}</span><span class="activity-time">${a.time}</span></div>
  `).join('');
}

function renderTimeline(){
  const sorted=[...tasks].filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date));
  const sc=document.getElementById('tl-scroll');
  if(!sorted.length){sc.innerHTML='<div class="empty"><div class="empty-icon">📅</div>Aucune tâche planifiée.</div>';return}
  const groups={};
  sorted.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  sc.innerHTML='';
  const dates=Object.keys(groups).sort();
  dates.forEach((date,di)=>{
    const grp=groups[date];
    const dlbl=label(fmtDate(date)+' — '+dlInfo(date).txt.replace('Retard ','⚠ '));
    dlbl.style.cssText='color:'+dlInfo(date).color+';margin-top:'+(di?12:0)+'px';
    sc.appendChild(dlbl);
    grp.forEach((t,i)=>{
      const el=document.createElement('div');
      el.className='tl-item';
      const dotColor=t.done?'var(--text3)':t.priority==='urgent'?'var(--danger)':'var(--accent)';
      el.innerHTML=`
        <div class="tl-left">
          <div class="tl-dot" style="background:${dotColor}"></div>
          ${(i<grp.length-1||di<dates.length-1)?'<div class="tl-line"></div>':''}
        </div>
        <div class="tl-body">
          <div class="tl-task${t.done?' done-txt':''}" style="${t.done?'text-decoration:line-through;color:var(--text3)':''}">${esc(t.title)}</div>
          <div class="tl-meta">
            <span class="cat-dot" style="background:${catColor(t.cat||'')}"></span>
            <span>${esc(t.cat||'Général')}</span>
            <span class="pri-badge pri-${t.done?'done':t.priority}" style="font-size:10px;padding:1px 6px">${t.done?'Fait':PLBL[t.priority]}</span>
          </div>
        </div>
      `;
      sc.appendChild(el);
    });
  });
}

function toggle(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  log(`${t.done?'✓':'↩'} "${t.title.slice(0,30)}"`);
  save();renderAll();
  toast(t.done?'Tâche terminée !':'Tâche réouverte');
}

function del(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  if(!confirm(`Supprimer "${t.title}" ?`))return;
  log(`Supprimé: "${t.title.slice(0,25)}"`);
  tasks=tasks.filter(x=>x.id!==id);
  save();renderAll();toast('Tâche supprimée');
}

function log(txt){
  const now=new Date();
  activity.unshift({txt,time:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  if(activity.length>20)activity.pop();
}

function setPri(el){
  selPri=el.dataset.p;
  document.querySelectorAll('.pri-opt').forEach(o=>{
    o.className='pri-opt'+(o.dataset.p===selPri?' sel-'+selPri:'');
  });
}

function openModal(){
  document.getElementById('f-date').value=today();
  document.getElementById('f-title').value='';
  document.getElementById('f-cat').value='';
  selPri='normal';
  document.querySelectorAll('.pri-opt').forEach(o=>{
    o.className='pri-opt'+(o.dataset.p==='normal'?' sel-normal':'');
  });
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),300);
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open')}
function bgClick(e){if(e.target===document.getElementById('modal-bg'))closeModal()}

function addTask(){
  const title=document.getElementById('f-title').value.trim();
  const date=document.getElementById('f-date').value;
  const cat=document.getElementById('f-cat').value.trim()||'Général';
  if(!title)return shake('f-title');
  if(!date)return shake('f-date');
  tasks.push({id:nextId++,title,date,priority:selPri,cat,done:false,created:today()});
  log(`Ajouté: "${title.slice(0,30)}"`);
  save();closeModal();renderAll();toast('Tâche ajoutée !');
}

function shake(id){
  const el=document.getElementById(id);
  el.style.animation='none';el.offsetHeight;
  el.style.borderColor='var(--danger)';
  setTimeout(()=>el.style.borderColor='',800);
}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  renderAll();
}

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// Clock
setInterval(()=>{
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
},15000);

load();
renderAll();
</script>
</body>
</html>
